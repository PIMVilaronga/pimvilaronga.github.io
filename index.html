<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7f6" />
    <title>Settee · Lead Scoring Audit</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="root"><main style="font:14px system-ui;padding:32px;color:#53625d">Carregando dashboard…</main></div>
    <script>
      window.addEventListener('error', (event) => {
        const root = document.getElementById('root')
        if (root && root.textContent.includes('Carregando dashboard')) {
          root.innerHTML = '<main style="font:14px system-ui;padding:32px;color:#7d3d31"><h1>Não foi possível carregar o dashboard</h1><p>' + String(event.message || 'Erro de inicialização do navegador.') + '</p><p>Atualize a página depois de verificar a conexão e as dependências.</p></main>'
        }
      })
    </script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script>
      (() => {
        const root = document.getElementById('root')
        const esc = (value) => String(value ?? '').replace(/[&<>'"]/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' })[char])
        const questionIds = ['Q2','Q3','Q4','Q5','Q6','Q7','Q8']
        const questionTitles = { Q2:'Objetivo no exterior', Q3:'Origem da renda', Q4:'Renda e patrimônio', Q5:'Vínculos com o Brasil', Q6:'País de interesse', Q7:'Prazo do planejamento', Q8:'Passos já realizados e investimento' }
        const state = { leads: [], selected:null, tab:'leads', search:'', priority:'all', pending:false, sort:'high', compare:[], reviewed:{}, source:'Nenhum arquivo importado' }
        const icon = (name, size = 16) => { const paths = { search:'<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/>', upload:'<path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M4 14v5h16v-5"/>', chevron:'<path d="m9 6 6 6-6 6"/>', check:'<path d="m5 12 4 4L19 6"/>', alert:'<path d="M12 3 2.8 20h18.4L12 3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/>', columns:'<rect x="3" y="4" width="7" height="16" rx="1"/><rect x="14" y="4" width="7" height="16" rx="1"/>', arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>', close:'<path d="m6 6 12 12"/><path d="m18 6-12 12"/>', sort:'<path d="M7 4v16"/><path d="m4 7 3-3 3 3"/><path d="M17 20V4"/><path d="m14 17 3 3 3-3"/>' }; return `<svg class="icon" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${paths[name] || ''}</svg>` }
        const badge = (text, tone='neutral') => `<span class="badge badge-${tone}">${esc(text)}</span>`
        const scoreText = (lead) => `${lead.score}/${lead.max}`
        const current = () => state.leads.find((lead) => lead.id === state.selected) || state.leads[0]
        const filtered = () => state.leads.filter((lead) => lead.id.toLowerCase().includes(state.search.toLowerCase()) && (state.priority === 'all' || lead.priority === state.priority) && (!state.pending || lead.reviews.some((review) => (state.reviewed[review.id] || review.status) === 'pending'))).sort((a,b) => state.sort === 'high' ? b.score-a.score : a.score-b.score)
        const questionCard = (lead, question) => { const review = lead.reviews.find((item) => item.q === question.id); const status = review ? (state.reviewed[review.id] || review.status) : ''; return `<article class="question-card ${question.review ? 'question-review' : ''}"><div class="question-head"><span class="question-number">${question.id === 'Q4' ? '◈' : question.id === 'Q8' ? '↗' : '◎'}</span><span class="question-heading"><small>${question.id}</small><strong>${esc(question.title)}</strong></span><span class="question-score"><b>${question.points}/${question.max}</b><span>pontos atribuídos</span></span>${question.review && `<span class="review-flag">${icon('alert',13)} revisão</span>`}<span class="question-chevron open">${icon('chevron',18)}</span></div><div class="question-body"><div class="answer-panel"><span class="eyebrow">Resposta do cliente</span><p>${esc(question.answer)}</p></div><div class="evaluation-grid"><div><span class="eyebrow">Opção técnica</span><p><strong>${question.id === 'Q4' ? 'Opção financeira: ' : 'Categoria: '}${esc(question.category)}</strong>${question.id === 'Q4' ? '<small>Não é o tier comercial do lead</small>' : ''}</p></div><div><span class="eyebrow">Interpretação</span><p>${question.evidence ? esc(question.evidence) : '<span class="muted">Evidência da LLM ausente no arquivo.</span>'}</p></div><div><span class="eyebrow">Regra utilizada</span><p>${esc(question.rule)}</p></div><div><span class="eyebrow">Origem / status</span><p>Parser determinístico<small>${question.review ? 'Revisão necessária' : 'Classificado'}</small></p></div></div>${question.id === 'Q8' ? '<div class="sub-evaluations"><span class="eyebrow">Avaliações internas de Q8</span><div class="sub-row"><span><b>Etapa</b>Classificação principal da etapa</span><strong>' + question.points + '/' + question.max + '</strong></div><div class="sub-row budget-row"><span><b>Orçamento</b>Informado, sem pontuação</span><strong>0 · fora da política</strong></div></div>' : ''}${question.review ? `<div class="review-reason">${icon('alert',15)}<span><b>Motivo de revisão</b>${esc(question.review)}</span><button class="review-toggle ${status === 'reviewed' ? 'is-reviewed' : ''}" data-review="${esc(review.id)}"><span class="review-dot">${status === 'reviewed' ? icon('check',11) : icon('alert',11)}</span>${status === 'reviewed' ? 'Revisado localmente' : 'Marcar como revisado'}</button></div>` : ''}</div></article>` }
        const sidebar = () => `<aside class="sidebar"><div class="sidebar-heading"><div><span class="eyebrow">Base importada</span><h2>Leads <span>${state.leads.length}</span></h2></div><button class="icon-button" data-upload>${icon('upload',16)}</button></div><div class="search-box">${icon('search',16)}<input data-search value="${esc(state.search)}" placeholder="Buscar por ID…"><kbd>/</kbd></div><div class="filter-row"><select data-priority><option value="all">Prioridade: todas</option><option value="A">Prioridade A</option><option value="B">Prioridade B</option><option value="C">Prioridade C</option><option value="D">Prioridade D</option></select><button class="sort-button" data-sort>${icon('sort',15)}${state.sort === 'high' ? 'Maior score' : 'Menor score'}</button></div><label class="switch-row"><span><span class="switch ${state.pending ? 'on' : ''}"><input type="checkbox" data-pending ${state.pending ? 'checked' : ''}><i></i></span> Apenas com pendências</span><span class="result-count">${filtered().length}</span></label><div class="lead-list">${filtered().map((lead) => `<button class="lead-item ${state.selected === lead.id ? 'selected' : ''}" data-select="${esc(lead.id)}"><span class="priority-marker priority-${lead.priority}">${lead.priority}</span><span class="lead-copy"><strong>${esc(lead.id)}</strong><small>${esc(lead.date)}</small></span><span class="lead-score"><b>${scoreText(lead)}</b>${lead.reviews.some((review) => (state.reviewed[review.id] || review.status) === 'pending') ? `<i>${icon('alert',12)}</i>` : ''}</span><span class="lead-chevron">${icon('chevron',15)}</span><span class="compare-check" data-compare="${esc(lead.id)}">${state.compare.includes(lead.id) ? icon('check',13) : '+'}</span></button>`).join('')}</div>${state.compare.length ? `<div class="compare-dock"><span><b>${state.compare.length}</b> selecionado${state.compare.length > 1 ? 's' : ''}</span><button data-tab="compare" ${state.compare.length < 2 ? 'disabled' : ''}>Comparar ${icon('arrow',14)}</button></div>` : ''}</aside>`
        const detail = (lead) => `<div class="detail-view"><div class="detail-topline"><span class="breadcrumb">Leads ${icon('chevron',12)} ${esc(lead.id)}</span><button class="button button-ghost" data-add-compare>${icon('columns',15)} Comparar este lead</button></div><section class="lead-header"><div class="lead-intro"><div class="avatar-mark">${esc(lead.id.replace('csv:',''))}</div><div><div class="title-line"><h1>${esc(lead.id)}</h1>${badge('Prioridade comercial: ' + lead.priority, lead.priority === 'A' ? 'green' : lead.priority === 'B' ? 'blue' : lead.priority === 'C' ? 'amber' : 'neutral')}${lead.reviews.length ? badge('Score incompleto','amber') : ''}</div><p>Enviado em ${esc(lead.date)}</p></div></div><div class="header-actions"><div class="compact-meta"><span>Política <b>${esc(lead.policy)}</b></span><span>Modelo <b>${esc(lead.model)}</b></span></div><div class="score-ring" style="--score:${lead.score / lead.max * 360}deg"><div><strong>${lead.score}</strong><span>/${lead.max}</span></div></div></div></section><div class="metric-strip"><div><span>Fit</span><strong>${lead.fit}</strong></div><div><span>Readiness</span><strong>${lead.readiness}</strong></div><div><span>Revisões pendentes</span><strong class="${lead.reviews.length ? 'text-amber' : ''}">${lead.reviews.length.toString().padStart(2,'0')}</strong></div><div><span>Máximo possível</span><strong>${lead.max} pts</strong></div></div><section class="content-section"><div class="section-heading"><div><span class="eyebrow">Auditoria individual</span><h2>Respostas e avaliação</h2></div><p>Sete critérios · origem e regra preservadas do pipeline</p></div><div class="question-list">${lead.questions.map((question) => questionCard(lead, question)).join('')}</div></section></div>`
        const compare = () => { const leads = state.compare.map((id) => state.leads.find((lead) => lead.id === id)).filter(Boolean); return `<div class="compare-view"><div class="page-heading"><div><span class="eyebrow">Leitura lado a lado</span><h1>Comparar leads</h1><p>Diferenças de nota ficam realçadas; respostas completas permanecem acessíveis.</p></div>${badge(leads.length + ' de 3 leads','blue')}</div><div class="compare-table-wrap"><table class="compare-table"><thead><tr><th>Critério</th>${leads.map((lead) => `<th><div class="compare-person"><span class="priority-marker priority-${lead.priority}">${lead.priority}</span><button data-select="${lead.id}">${lead.id}</button><button class="remove-compare" data-remove="${lead.id}">${icon('close',13)}</button></div><small>${scoreText(lead)} · ${lead.fit} fit</small></th>`).join('')}</tr></thead><tbody>${['Q2','Q3','Q4','Q5','Q6','Q7','Q8'].map((id) => { const qs = leads.map((lead) => lead.questions.find((question) => question.id === id)); const scores = qs.map((question) => question && question.points); const different = new Set(scores).size > 1; return `<tr><td><b>${id}</b><span>${qs[0]?.title || id}</span></td>${qs.map((question) => `<td class="${different ? 'different' : ''}"><p>${esc(question?.answer || '—')}</p><div class="compare-meta"><strong>${question?.points ?? '—'}/${question?.max ?? '—'}</strong><span>${question?.id === 'Q4' ? 'Opção financeira' : 'Categoria'} ${esc(question?.category || '—')}</span></div>${question?.review ? `<span class="mini-review">${icon('alert',12)} ${esc(question.review)}</span>` : ''}</td>`).join('')}</tr>` }).join('')}</tbody></table></div></div>` }
        const audit = () => `<div class="audit-view"><div class="page-heading"><div><span class="eyebrow">Controle de qualidade</span><h1>Auditoria</h1><p>Importe um XLSX para iniciar a auditoria.</p></div><div class="audit-summary"><strong>0</strong><span>achados</span></div></div><div class="clean-audit"><div class="clean-icon">${icon('check',22)}</div><h2>Nenhum arquivo importado</h2><p>As divergências aparecerão aqui depois que os dados forem carregados.</p></div></div>`
        const render = () => { const lead = current(); root.innerHTML = `<header class="topbar"><div class="brand"><span class="brand-mark">S</span><span class="brand-word">settee</span><span class="brand-divider"></span><span class="brand-product">Lead scoring <b>audit</b></span></div><div class="top-actions"><span class="local-status"><i></i> local only</span><button class="button button-outline" data-upload>${icon('upload',15)} Importar XLSX</button><input id="file-input" type="file" accept=".xlsx,.xls" hidden></div></header>${sidebar()}<main class="main-content"><nav class="view-tabs"><button class="${state.tab === 'leads' ? 'active' : ''}" data-tab="leads"><span>01</span> Leads</button><button class="${state.tab === 'compare' ? 'active' : ''}" data-tab="compare"><span>02</span> Comparar ${state.compare.length ? `<em>${state.compare.length}</em>` : ''}</button><button class="${state.tab === 'audit' ? 'active' : ''}" data-tab="audit"><span>03</span> Auditoria</button><span class="source-label">${icon('check',13)} ${esc(state.source)}</span></nav>${state.tab === 'leads' && lead ? detail(lead) : state.tab === 'compare' && state.compare.length >= 2 ? compare() : state.tab === 'audit' ? audit() : '<div class="empty-state"><div class="empty-icon">' + icon('upload',24) + '</div><h2>Importe o XLSX para começar</h2><p>Nenhum dado é carregado antes da importação. O arquivo permanece no navegador.</p><button class="button button-primary" data-upload>' + icon('upload',15) + ' Selecionar XLSX</button></div>'}</main>`; bind() }
const handleFile = async (event) => { const file = event.target.files?.[0]; if (!file) return; if (!window.XLSX) { alert('A biblioteca de leitura do Excel não foi carregada. Conecte-se à internet e tente novamente.'); return } try { const workbook = XLSX.read(await file.arrayBuffer(), { type:'array', cellDates:true }); const summaryName = workbook.SheetNames.find((name) => /resumo/i.test(name)); const detailName = workbook.SheetNames.find((name) => /detalhamento|detalhes/i.test(name)); if (!summaryName || !detailName) throw new Error('O arquivo precisa conter as abas Resumo e Detalhamento.'); const summary = XLSX.utils.sheet_to_json(workbook.Sheets[summaryName], { defval:'' }); const details = XLSX.utils.sheet_to_json(workbook.Sheets[detailName], { defval:'' }); const get = (row, names) => { const key = Object.keys(row).find((item) => names.some((name) => item.toLowerCase().trim() === name)); return row[key] }; const ids = [...new Set(summary.map((row) => String(get(row,['lead','id do lead','identificador']) || '')).filter(Boolean))]; if (!ids.length) throw new Error('Nenhum Lead foi encontrado na aba Resumo.'); state.leads = ids.map((id) => { const row = summary.find((item) => String(get(item,['lead','id do lead','identificador'])) === id); const rows = details.filter((item) => String(get(item,['lead','id do lead','identificador'])) === id); const questions = questionIds.map((questionId) => { const detail = rows.find((item) => String(get(item,['pergunta','question','questão']) || '').toUpperCase().includes(questionId)); return { id:questionId, title:questionTitles[questionId], answer:String(detail ? get(detail,['resposta','resposta original','answer']) : 'Não encontrada no arquivo'), points:Number(detail ? get(detail,['pontos','score','nota']) : 0) || 0, max:Number(detail ? get(detail,['máximo','max','pontos máximos']) : 0) || 0, category:String(detail ? get(detail,['categoria','category','opção']) : 'Não informada'), evidence:String(detail ? get(detail,['evidência','evidence']) : ''), rule:String(detail ? get(detail,['regra','rule']) : 'Regra não informada no arquivo') } }); return { id, date:String(get(row,['envio (utc)','data','data de envio']) || 'Data não informada'), score:Number(get(row,['score','score total','pontuação total']) || 0), max:Number(get(row,['score máximo','máximo','max score']) || 90), fit:String(get(row,['fit']) || '—'), readiness:String(get(row,['readiness','prontidão']) || '—'), priority:String(get(row,['faixa','prioridade comercial','prioridade','tier']) || '—'), policy:String(get(row,['política','policy']) || 'Não informada'), model:String(get(row,['modelo','model']) || 'Não informado'), questions, reviews:[] } }); state.source = file.name; state.selected = state.leads[0].id; state.compare = []; state.tab = 'leads'; render() } catch (error) { alert(error.message || 'Não foi possível ler o arquivo.') } }
        const bind = () => { root.querySelectorAll('[data-upload]').forEach((element) => element.addEventListener('click', () => root.querySelector('#file-input').click())); root.querySelectorAll('[data-tab]').forEach((element) => element.addEventListener('click', () => { const tab = element.dataset.tab; if (tab === 'compare' && state.compare.length < 2) return; state.tab = tab; render() })); root.querySelectorAll('[data-select]').forEach((element) => element.addEventListener('click', () => { state.selected = element.dataset.select; state.tab = 'leads'; render() })); root.querySelectorAll('[data-compare]').forEach((element) => element.addEventListener('click', (event) => { event.stopPropagation(); const id = element.dataset.compare; state.compare = state.compare.includes(id) ? state.compare.filter((item) => item !== id) : state.compare.length < 3 ? [...state.compare, id] : state.compare; render() })); root.querySelectorAll('[data-remove]').forEach((element) => element.addEventListener('click', () => { state.compare = state.compare.filter((id) => id !== element.dataset.remove); render() })); root.querySelector('[data-search]')?.addEventListener('input', (event) => { state.search = event.target.value; render(); const input = root.querySelector('[data-search]'); input.focus(); input.setSelectionRange(input.value.length, input.value.length) }); root.querySelector('[data-priority]')?.addEventListener('change', (event) => { state.priority = event.target.value; render() }); root.querySelector('[data-sort]')?.addEventListener('click', () => { state.sort = state.sort === 'high' ? 'low' : 'high'; render() }); root.querySelector('[data-pending]')?.addEventListener('change', (event) => { state.pending = event.target.checked; render() }); root.querySelector('[data-add-compare]')?.addEventListener('click', () => { if (!state.compare.includes(state.selected) && state.compare.length < 3) state.compare.push(state.selected); state.tab = 'compare'; render() }); root.querySelectorAll('[data-review]').forEach((element) => element.addEventListener('click', () => { const id = element.dataset.review; state.reviewed[id] = state.reviewed[id] === 'reviewed' ? 'pending' : 'reviewed'; render() })); root.querySelector('#file-input')?.addEventListener('change', handleFile) }
        render()
      })()
    </script>
  </body>
</html>
